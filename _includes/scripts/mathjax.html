  {%- if site.enable_math -%}
  <!-- MathJax -->
  <script type="text/javascript">
    window.MathJax = {
      tex: {
        tags: 'ams',
        // MathJax 3 does not treat single $ as an inline delimiter by default.
        // Course notes and project pages use $...$ for inline math, so enable it.
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        // Never typeset inside code — several posts use $ in shell snippets.
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code',
                       'annotation', 'annotation-xml']
      }
    };
  </script>
  <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@{{ site.mathjax.version }}/es5/tex-mml-chtml.js"></script>
  <script defer src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  {%- endif %}
